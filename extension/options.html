<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #F5F7FA;
      color: #0F172A;
      max-width: 420px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { font-size: 18px; font-weight: 600; }
    label { display: block; font-size: 12px; color: #475569; margin: 16px 0 4px; }
    input {
      width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #DDE3EC;
      border-radius: 3px; font-size: 13px;
    }
    input:focus { outline: none; border-color: #14B8A6; }
    button {
      margin-top: 16px; padding: 9px 16px; background: #0D1526; color: #F5F7FA;
      border: none; border-radius: 3px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .saved { color: #0D9488; font-size: 12px; margin-top: 8px; display: none; }
    .hint { font-size: 11px; color: #64748B; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>DDAS Extension — Settings</h1>
  <label for="apiBase">DDAS API base URL</label>
  <input id="apiBase" type="url" placeholder="http://localhost:4000" />
  <div class="hint">
    Point this at your DDAS backend — e.g. <code>http://localhost:4000</code> for local Docker Compose,
    or your department's deployed instance.
  </div>
  <button id="save">Save</button>
  <div class="saved" id="saved">Saved.</div>

  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
