# DDAS horizontal-scaling demo.
#
# Fronts the `api` service. Uses Docker's embedded DNS (127.0.0.11) with a
# `resolver` directive + a variable in proxy_pass, which forces nginx to
# re-resolve "api" on every request rather than caching it once at startup —
# necessary because `docker compose up --scale api=3` adds/removes container
# IPs behind that single hostname, and nginx otherwise only sees whichever
# one existed when it started.
#
# This is NOT used by the main frontend by default (the frontend talks to
# `api:4000` directly via the Vite proxy) — it's a separate, deliberate demo
# path. See ddas/README.md for how to run it.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 8080;

        location / {
            set $upstream http://api:4000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Surface which container actually served the request — makes
            # the round-robin visible during a live demo.
            add_header X-Upstream-Addr $upstream_addr always;
        }

        location /health {
            set $upstream http://api:4000;
            proxy_pass $upstream/health;
        }
    }
}
