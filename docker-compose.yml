version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ddas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ddas
      POSTGRES_PASSWORD: ddas_dev_password
      POSTGRES_DB: ddas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ddas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ddas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ddas_admin
      MINIO_ROOT_PASSWORD: ddas_dev_password
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ddas-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # No fixed host port mapping here on purpose — it would collide when
    # scaled (`--scale api=3` can't bind three containers to the same host
    # port). The frontend reaches it over the internal Docker network via
    # the "api" hostname; for the scaling demo, go through nginx on :8080
    # instead. If you want ad-hoc host access to a single instance, add
    # back `ports: ["4000:4000"]` — just remove it again before scaling.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src   # live-reload during dev

  worker:
    build:
      context: ./backend
    container_name: ddas-worker
    restart: unless-stopped
    command: ["node", "src/workers/fingerprintWorker.js"]
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
    container_name: ddas-frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:4000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

  # Scaling demo only — not used by the frontend by default. Bring it up
  # alongside multiple API replicas with:
  #   docker compose up -d --scale api=3
  #   docker compose up -d nginx
  # then hit http://localhost:8080/health repeatedly and watch the
  # X-Upstream-Addr response header change between replicas.
  nginx:
    image: nginx:1.27-alpine
    container_name: ddas-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
  minio_data:
  esdata:
